display_information:
  name: Cookie Nudge
  description: Reminds you about unanswered mentions during working hours.
  background_color: "#2E6B5B"
features:
  bot_user:
    display_name: Cookie Nudge
    always_online: false
  slash_commands:
    - command: /cookie-nudge
      description: Check reply reminder status and timezone.
      usage_hint: "timezone Asia/Seoul | timezone auto"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
      - commands
      - groups:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
